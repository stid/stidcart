[workspace]
members = ["crates/stidcart-core", "crates/stidcart-cli"]
# The GUI is its own workspace so the gate never compiles webkit (D-030).
exclude = ["gui/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.30.0"
edition = "2021"
license = "GPL-2.0-or-later"
repository = "https://github.com/stid/stidcart"

[profile.release]
lto = true
