# TEMPORARY (windows-app): builds only the Windows legs and screenshots the app, so release.yml's
# macOS jobs do not run for every probe. Deleted before the PR is final.
name: Windows probe

on:
  push:
    branches: [feat/release-windows]
    paths:
      - .github/workflows/windows-probe.yml
      - gui/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-probe
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  VERSION: "0.30.0"

jobs:
  command:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      NAME: stidcart-cli-0.30.0-windows-x86_64
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install --no-self-update
          rustup target add x86_64-pc-windows-msvc
      - name: Build
        run: cargo build --release --locked -p stidcart-cli --target x86_64-pc-windows-msvc
      - name: Assemble
        run: |
          mkdir "$NAME"
          cp target/x86_64-pc-windows-msvc/release/stidcart.exe "$NAME/stidcart.exe"
          cp COPYING "$NAME/COPYING"
          cp firmware/COPYING "$NAME/COPYING.firmware"
      - name: Run it
        run: |
          printf '\001\010\140' >smoke.prg
          "$NAME/stidcart.exe" build -o smoke.crt smoke.prg
          "$NAME/stidcart.exe" list smoke.crt
          grep -a -q "stidcart $VERSION" smoke.crt
          echo "-- DLLs named in the binary --"
          grep -a -o -i '[a-z0-9_-]*\.dll' "$NAME/stidcart.exe" | sort -u
          if grep -a -q -i 'vcruntime' "$NAME/stidcart.exe"; then
            echo "the command still needs the Visual C++ runtime" >&2
            exit 1
          fi
      - name: Archive
        run: 7z a -tzip "$NAME.zip" "$NAME"
      - uses: actions/upload-artifact@v7
        with:
          name: probe-command
          path: ${{ env.NAME }}.zip
          if-no-files-found: error

  app:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      NAME: stidcart-0.30.0-windows-x86_64
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri
      - uses: actions/setup-node@v7
        with:
          node-version-file: gui/.nvmrc
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - name: Build
        working-directory: gui
        run: |
          npm ci
          npm run tauri build -- --config '{"bundle":{"active":true,"targets":["nsis"]}}'
      - name: Check and collect
        run: |
          release=gui/src-tauri/target/release
          ls -la "$release" "$release/bundle/nsis"
          installers=("$release"/bundle/nsis/*-setup.exe)
          [[ ${#installers[@]} -eq 1 ]] || { echo "expected one installer, found ${#installers[@]}" >&2; exit 1; }
          cp "${installers[0]}" "$NAME-setup.exe"
          for exe in "$release/stidcart-gui.exe" "$NAME-setup.exe"; do
            built="$(powershell -NoProfile -Command "(Get-Item '$exe').VersionInfo.ProductVersion" | tr -d '\r')"
            echo "$exe says $built"
            [[ $built == "$VERSION" ]] || { echo "$exe says $built, not $VERSION" >&2; exit 1; }
          done
          echo "-- DLLs named in the app --"
          grep -a -o -i '[a-z0-9_-]*\.dll' "$release/stidcart-gui.exe" | sort -u
      - name: Install it
        shell: pwsh
        run: |
          $setup = Start-Process -FilePath ".\$env:NAME-setup.exe" -ArgumentList '/S' -Wait -PassThru
          "installer exit code: $($setup.ExitCode)"
          Get-ChildItem -Recurse "$env:LOCALAPPDATA\stidcart" | Select-Object FullName, Length
          Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' |
            Where-Object DisplayName -like '*stidcart*' | Format-List DisplayName, DisplayVersion, UninstallString, InstallLocation
      - name: Screenshots
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          try { Set-DisplayResolution -Width 1280 -Height 1024 -Force } catch { "resolution stays: $_" }
          New-Item -ItemType Directory -Force shots | Out-Null
          function Shot([string]$name) {
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
            $bmp.Save("$PWD\shots\$name.png")
            $g.Dispose(); $bmp.Dispose()
            "shot $name"
          }
          Add-Type @"
          using System; using System.Runtime.InteropServices;
          public static class Win {
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int L, T, R, B; }
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
            [DllImport("user32.dll")] public static extern void mouse_event(uint f, uint x, uint y, uint d, UIntPtr e);
            [DllImport("user32.dll")] public static extern IntPtr GetForegroundWindow();
            public static void Click(int x, int y) { SetCursorPos(x, y); mouse_event(2, 0, 0, 0, UIntPtr.Zero); mouse_event(4, 0, 0, 0, UIntPtr.Zero); }
            [StructLayout(LayoutKind.Sequential)] public struct GUITHREADINFO { public int cbSize; public int flags; public IntPtr hwndActive, hwndFocus, hwndCapture, hwndMenuOwner, hwndMoveSize, hwndCaret; public RECT rcCaret; }
            [DllImport("user32.dll")] public static extern bool GetGUIThreadInfo(uint t, ref GUITHREADINFO g);
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern int GetClassName(IntPtr h, System.Text.StringBuilder s, int n);
            public static string FocusClass() { var g = new GUITHREADINFO(); g.cbSize = Marshal.SizeOf(g); GetGUIThreadInfo(0, ref g); var s = new System.Text.StringBuilder(256); GetClassName(g.hwndFocus, s, 256); return g.hwndFocus + " " + s; }
          }
          "@
          $exe = "$env:LOCALAPPDATA\stidcart\stidcart-gui.exe"
          $app = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 20
          $app.Refresh()
          $main = $app.MainWindowHandle
          "main window title: '$($app.MainWindowTitle)'"
          # A real click is what gives a window the keyboard. $dy from the top: 12 is the title
          # bar; a negative one counts from the bottom, inside the page.
          function Focus([int]$dy) {
            $r = New-Object Win+RECT
            $null = [Win]::GetWindowRect($main, [ref]$r)
            $y = if ($dy -lt 0) { $r.B + $dy } else { $r.T + $dy }
            [Win]::Click([int](($r.L + $r.R) / 2), $y)
            Start-Sleep -Seconds 1
            "focus at $dy; rect $($r.L),$($r.T),$($r.R),$($r.B); foreground is main: $([Win]::GetForegroundWindow() -eq $main)"
          }
          function Keys([string]$k) {
            [System.Windows.Forms.SendKeys]::SendWait($k)
            Start-Sleep -Seconds 2
          }
          function At([int]$dx, [int]$dy) {
            $r = New-Object Win+RECT
            $null = [Win]::GetWindowRect($main, [ref]$r)
            [Win]::Click($r.L + $dx, $r.T + $dy)
            Start-Sleep -Seconds 2
          }
          function Where([string]$when) { "$when; main is $main; keyboard focus: $([Win]::FocusClass())" }
          Focus 12; Where 'after a click on the title bar'
          Shot '01-empty'
          Keys '%f'; Shot '02-alt-f'; Keys '{ESC}'; Keys '{ESC}'
          Keys '^n'; Where 'after Ctrl+N from the title bar'; Shot '03-ctrl-n-from-title-bar'
          At 24 40; Where 'with File open by a click'; Shot '04-file-menu-by-click'
          Keys '{ESC}'; Where 'after the menu closed'
          Keys '^n'; Shot '05-ctrl-n-after-menu'
          At 190 40; Shot '06-help-menu-by-click'; Keys '{ENTER}'; Start-Sleep -Seconds 2; Shot '07-about'; Keys '{ENTER}'
          At 679 469; Where 'after a click on New Cart'; Shot '08-new-cart-by-click'
          Focus -30; Where 'after a click in the page'
          Keys '^+n'; Shot '09-ctrl-shift-n-from-page'
          Keys '{ENTER}'; Shot '10-entered'
          Keys '^z'; Shot '11-ctrl-z'
          Keys '^+h'; Start-Sleep -Seconds 5; Shot '12-ctrl-shift-h'
          Focus 12
          Keys '^q'; Start-Sleep -Seconds 3; Shot '13-ctrl-q'
          Keys '{ESC}'; Shot '14-after-esc'
          Get-Process stidcart-gui -ErrorAction SilentlyContinue | Format-Table Id, MainWindowTitle
          Get-Process stidcart-gui -ErrorAction SilentlyContinue | Stop-Process -Force
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: probe-shots
          path: shots
      - uses: actions/upload-artifact@v7
        with:
          name: probe-app
          path: ${{ env.NAME }}-setup.exe
          if-no-files-found: error
