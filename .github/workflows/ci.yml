# The quality gate from CLAUDE.md ("How to work here"), run on every PR and on main, scoped to
# what the change can affect (D-071). docs/lcd/ci/scope.sh decides the groups, here and in the
# local gate (docs/lcd/ci/gate.sh), so a green local run and the required checks cannot drift.
# Keep the commands below identical to gate.sh's.
#
# Both jobs always start and always report, because both are required checks: a job that a
# path filter never started would leave its check pending forever. What a run does not need is
# skipped step by step, after the Scope step. "Run workflow" runs everything.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: gate
    # Pinned rather than ubuntu-latest: the cached 64tass and VICE builds below are native
    # binaries, and restoring one built on another image would fail in confusing ways (D-038).
    runs-on: ubuntu-24.04
    env:
      # The boot and reassembly tests skip when x64sc or 64tass is missing. Here a missing tool
      # is a failure instead, so those checks can never pass by not running (AC-94).
      STIDCART_REQUIRE_TOOLS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          # ci-scope.sh compares against the base branch, or the commit before the push.
          fetch-depth: 0

      - name: Scope
        id: scope
        env:
          BEFORE: ${{ github.event.before }}
        run: docs/lcd/ci/ci-scope.sh

      # No toolchain argument on purpose: rustup then installs "the active toolchain",
      # i.e. whatever rust-toolchain.toml pins, with the components and profile it
      # names. Naming `stable` here instead would silently un-pin CI.
      - name: Install Rust
        if: steps.scope.outputs.rust == 'true'
        run: rustup toolchain install --no-self-update

      - uses: Swatinem/rust-cache@v2
        if: steps.scope.outputs.rust == 'true'

      # 64tass reassembles menu/ (AC-93) and VICE boots carts (AC-4, AC-87..AC-92). Both are
      # built from pinned, sha256-checked sources. The key changes with the script, which holds
      # the versions, and with the runner image.
      - name: Cache 64tass and VICE
        if: steps.scope.outputs.rust == 'true'
        id: menu-tools
        uses: actions/cache@v6
        with:
          path: ~/.cache/stidcart-menu-tools
          key: menu-tools-ubuntu-24.04-${{ hashFiles('docs/lcd/ci/install-menu-tools.sh') }}

      - name: Install the build dependencies of 64tass and VICE
        if: steps.scope.outputs.rust == 'true' && steps.menu-tools.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config bison flex xa65 dos2unix unzip

      - name: Install 64tass and VICE
        if: steps.scope.outputs.rust == 'true'
        run: |
          docs/lcd/ci/install-menu-tools.sh ~/.cache/stidcart-menu-tools
          echo "$HOME/.cache/stidcart-menu-tools/bin" >> "$GITHUB_PATH"

      - name: Format
        if: steps.scope.outputs.rust == 'true'
        run: cargo fmt --all --check

      - name: Clippy
        if: steps.scope.outputs.rust == 'true'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        if: steps.scope.outputs.rust == 'true'
        env:
          # none, cart or full: which of the emulator boots this change calls for.
          STIDCART_VICE: ${{ steps.scope.outputs.vice }}
        run: cargo test --workspace

  # The root tests on Windows, to show the command works there before a Windows build ships
  # (release roadmap step 2). Not a required check. Format and clippy belong to `gate`, the GUI to
  # `gui`. STIDCART_REQUIRE_TOOLS stays unset: the emulator boots and the 64tass reassembly skip
  # here, so the job tests what the command writes and reads, not what VICE makes of it.
  windows:
    name: windows
    runs-on: windows-latest
    defaults:
      run:
        # Git Bash, which the runner image ships: ci-scope.sh and scope.sh are bash scripts.
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          # ci-scope.sh compares against the base branch, or the commit before the push.
          fetch-depth: 0

      - name: Scope
        id: scope
        env:
          BEFORE: ${{ github.event.before }}
        run: docs/lcd/ci/ci-scope.sh

      # No toolchain argument, as in `gate`: rustup installs what rust-toolchain.toml pins.
      - name: Install Rust
        if: steps.scope.outputs.rust == 'true'
        run: rustup toolchain install --no-self-update

      - uses: Swatinem/rust-cache@v2
        if: steps.scope.outputs.rust == 'true'

      # --no-fail-fast: this job reports what breaks on Windows, so it runs every target rather
      # than stopping at the first that fails.
      - name: Test
        if: steps.scope.outputs.rust == 'true'
        run: cargo test --workspace --no-fail-fast

  # The GUI is its own Cargo workspace (D-030), so `gate` never compiles it. This job runs the
  # same script as the local gate, after installing what Tauri needs to build on Linux.
  gui:
    name: gui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # ci-scope.sh compares against the base branch, or the commit before the push.
          fetch-depth: 0

      - name: Scope
        id: scope
        env:
          BEFORE: ${{ github.event.before }}
        run: docs/lcd/ci/ci-scope.sh

      - name: Install Rust
        if: steps.scope.outputs.gui == 'true'
        run: rustup toolchain install --no-self-update

      - name: Install Linux build dependencies
        if: steps.scope.outputs.gui == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v7
        if: steps.scope.outputs.gui == 'true'
        with:
          node-version-file: gui/.nvmrc
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - uses: Swatinem/rust-cache@v2
        if: steps.scope.outputs.gui == 'true'
        with:
          workspaces: gui/src-tauri

      - name: GUI gate
        if: steps.scope.outputs.gui == 'true'
        run: docs/lcd/ci/gui-gate.sh
