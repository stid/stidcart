# The quality gate from CLAUDE.md ("How to work here"), run on every PR and on main.
# Keep the steps identical to the command documented there — CI and the local pre-commit
# check must not drift, or a green local run can still fail the required check.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No toolchain argument on purpose: rustup then installs "the active toolchain",
      # i.e. whatever rust-toolchain.toml pins, with the components and profile it
      # names. Naming `stable` here instead would silently un-pin CI.
      - name: Install Rust
        run: rustup toolchain install --no-self-update

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace

  # The GUI is its own Cargo workspace (D-030), so `gate` never compiles it. This job runs the
  # same script as the local gate, after installing what Tauri needs to build on Linux.
  gui:
    name: gui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: rustup toolchain install --no-self-update

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v7
        with:
          node-version-file: gui/.nvmrc
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri

      - name: GUI gate
        run: docs/lcd/ci/gui-gate.sh
