# Claude review gate — every PR is reviewed, and a high-severity finding blocks the merge.
#
# Auth is the Claude GitHub App's OAuth token, stored as the repository secret
# CLAUDE_CODE_OAUTH_TOKEN (created by `/install-github-app` in Claude Code). The secret is
# the single point of failure for this check: without it the action fails, the job goes red,
# and — once `claude-review` is a required status check — every PR is blocked with no owner
# bypass, because `enforce_admins` is on (D-009). Do not make this check required until it
# has actually run green on a PR.

name: Claude review

# Deliberately NOT `paths:`-filtered, for the reason D-009 records: a filtered job never
# reports on a PR outside the filter, and a required check that never reports sits in
# "Expected" forever, blocking the PR with nothing able to clear it. Filter inside the job
# if that is ever wanted, never in `on:`.
on:
  pull_request:

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Review the changes
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review this pull request against the base branch. Read `CLAUDE.md`,
            `.claude/rules/lcd-conventions.md`, `docs/lcd/MAP.md`, and `docs/lcd/DECISIONS.md`
            first — this project has recorded invariants and past decisions, and a "finding"
            that contradicts one of them is not a finding.

            This is a Rust workspace producing byte-exact EasyFlash cartridge images for the
            Commodore 64. Weight your attention accordingly:

            - Byte parity against the frozen fixtures in `fixtures/` gates the write path. A
              change that alters produced bytes must update the fixtures deliberately and say
              why. Silent fixture churn is a high-severity finding.
            - Binary-format facts come from the extracted spec, not from re-reading the
              reference C implementation. Code that appears to have re-derived an offset or a
              layout rule from `ndefpack` is worth flagging.
            - The core library holds no global mutable state and makes no I/O policy
              decisions. A `static mut`, a lazily-initialised singleton, or a filesystem call
              in `stidcart-core` is high severity.
            - `firmware/` is zlib-licensed; everything else is GPL-2.0-or-later. Code moving
              across that boundary in either direction is high severity.
            - Anything reading a file-supplied length, offset, or bank number must
              bounds-check it before it reaches an index.

            Post your findings as a PR comment. Then return the structured result.

            Set `blocking: true` **only** for a defect you are confident is real and that
            would produce wrong behaviour, corrupt output, or a panic — the kind of thing that
            should stop a merge. Style, naming, structure, test-organisation preferences, and
            anything you are unsure about go in `findings` with a lower severity and
            `blocking: false`. A blocking finding must name the input or state that triggers
            it. When in doubt, do not block: this check is only worth having if a red result
            means something.
          claude_args: |
            --allowedTools Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(gh pr:*)
            --json-schema '{"type":"object","properties":{"blocking":{"type":"boolean"},"summary":{"type":"string"},"findings":{"type":"array","items":{"type":"object","properties":{"file":{"type":"string"},"line":{"type":"integer"},"severity":{"type":"string","enum":["high","medium","low"]},"blocking":{"type":"boolean"},"summary":{"type":"string"}},"required":["file","severity","blocking","summary"]}}},"required":["blocking","summary","findings"]}'

      - name: Block the merge on a high-severity finding
        env:
          RESULT: ${{ steps.review.outputs.structured_output }}
        run: |
          set -euo pipefail

          # An empty result means the review did not produce one — treat that as a failure of
          # the check rather than a pass, so a broken review can never look like a clean bill.
          if [ -z "${RESULT:-}" ]; then
            echo "::error::the review produced no structured output"
            exit 1
          fi

          echo "$RESULT" | jq -r '.summary'
          echo "$RESULT" | jq -r '
            .findings[]
            | "\(if .blocking then "BLOCKING" else .severity end)  \(.file):\(.line // 0)  \(.summary)"
          '

          if [ "$(echo "$RESULT" | jq -r '.blocking')" = "true" ]; then
            echo "::error::blocking finding — see the review comment on this PR"
            exit 1
          fi
          echo "no blocking findings"
