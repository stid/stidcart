# Claude review gate — the official code-review plugin does the reviewing, and this workflow
# turns its verdict into a merge gate.
#
# Two things this adds over the plugin's stock invocation, both load-bearing:
#
#   1. `--comment`, plus `pull-requests: write`. Without the flag the plugin's own step 7 says
#      "stop here, do not post any GitHub comments", and without the permission it could not
#      post even if asked — so the stock setup reviews at full cost and discards the result
#      into the Actions log. Measured on PR #13: 25 turns, 2m48s, ~$1 of subscription usage,
#      zero comments posted.
#
#   2. A verdict this job can fail on. The plugin reports; it never exits non-zero.
#
# Auth is the Claude GitHub App's OAuth token (`/install-github-app`), which draws on the
# Claude subscription rather than API billing. One review per PR-push is the budget; do not
# add a second reviewing workflow alongside this one.
#
# A pull request whose whole diff against its base is Markdown is not reviewed: the check passes
# with a notice instead (D-043). The test is the whole diff, never the latest push, so a
# docs-only push after a blocking finding cannot turn the gate green.

name: Claude review

# Deliberately NOT `paths:`-filtered, per D-009: a filtered job never reports on a PR outside
# the filter, and a required check that never reports sits in "Expected" forever with nothing
# able to clear it. Filter inside the job if that is ever wanted, never in `on:`.
on:
  pull_request:

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide whether the change has code to review
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "$BASE...$HEAD")
          echo "$changed"
          # Markdown only: every changed path ends in .md. An empty diff is reviewed as usual.
          if [ -n "$changed" ] && ! grep -qv '\.md$' <<<"$changed"; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Review the pull request
        id: review
        if: steps.scope.outputs.docs_only != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: |
            /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment

            The instructions above are the review procedure. The following apply to this run
            and take precedence where they conflict with it.

            **This review is a merge gate, and it runs again on every push to the pull
            request.** Do not stop because Claude has already commented here — that skip
            condition is for one-shot reviews and would let a later push through unread.
            Review the current head commit on its own terms. Still stop for a closed or draft
            pull request, and still skip a change that genuinely does not need review.

            Do not post a second comment for an issue you have already commented on in this
            pull request; comment only on issues that are new or still unaddressed.

            This project keeps its constitution and conventions in `CLAUDE.md`, its structure
            and invariants in `docs/lcd/MAP.md`, and its settled decisions in
            `docs/lcd/DECISIONS.md`. Read the decisions log before flagging anything that
            looks like a deliberate choice — a finding that contradicts a recorded decision is
            noise, and the log explains what was already considered and rejected.

            Weigh these project-specific invariants alongside the standard bug hunt:

            - Byte parity against the frozen fixtures in `fixtures/` gates the write path.
              Output that changes without the fixtures being updated in the same commit, and
              without the commit saying why, is a blocking finding.
            - Binary-format facts come from the extracted spec, not from re-reading the
              reference C implementation. Code that looks like it re-derived an offset or a
              layout rule from `ndefpack` is worth flagging.
            - `stidcart-core` holds no global mutable state and makes no I/O policy decisions.
            - `firmware/` is zlib-licensed; everything else is GPL-2.0-or-later.
            - Any file-supplied length, offset, or bank number must be bounds-checked before
              it reaches an index.

            Finish by returning the structured verdict.

            Set `blocking: true` only for a finding that survived the validation step and that
            would produce wrong behaviour, corrupt output, or a panic — something that should
            stop a merge. Everything else is reported with `blocking: false`: it still gets a
            comment, it just does not fail the build. A gate that goes red on style is one
            that gets routinely overridden, and an overridden gate is not a gate.

            Set `reviewed: false` with a `skip_reason` only when you genuinely did not review
            (closed or draft pull request, or a change that needs no review). Never report
            `reviewed: false` because the review was inconvenient or the diff was large.
          claude_args: |
            --json-schema '{"type":"object","properties":{"reviewed":{"type":"boolean"},"skip_reason":{"type":["string","null"]},"blocking":{"type":"boolean"},"summary":{"type":"string"},"findings":{"type":"array","items":{"type":"object","properties":{"file":{"type":"string"},"line":{"type":"integer"},"severity":{"type":"string","enum":["high","medium","low"]},"blocking":{"type":"boolean"},"summary":{"type":"string"}},"required":["file","severity","blocking","summary"]}}},"required":["reviewed","blocking","summary","findings"]}'

      - name: Gate the merge on the verdict
        env:
          DOCS_ONLY: ${{ steps.scope.outputs.docs_only }}
          CONCLUSION: ${{ steps.review.outputs.conclusion }}
          VERDICT: ${{ steps.review.outputs.structured_output }}
        run: |
          set -euo pipefail

          if [ "${DOCS_ONLY:-}" = "true" ]; then
            echo "::notice::not reviewed: every file this pull request changes is Markdown (D-043)"
            exit 0
          fi

          # Liveness first. This action exits SUCCESSFULLY when it has done nothing at all —
          # observed three separate times while building this: no OAuth secret configured, and
          # twice when the workflow file did not yet match the copy on the default branch (it
          # validates that before running, and silently skips otherwise). Every one of those
          # would have shown a green check with no review behind it. Never treat this step's
          # own status as evidence that a review happened; require a verdict.
          if [ "${CONCLUSION:-}" != "success" ]; then
            echo "::error::the review did not complete (conclusion: ${CONCLUSION:-none})"
            exit 1
          fi
          if [ -z "${VERDICT:-}" ]; then
            echo "::error::the review produced no verdict — it was skipped or failed to report"
            exit 1
          fi

          echo "$VERDICT" | jq -r '.summary'

          if [ "$(echo "$VERDICT" | jq -r '.reviewed')" != "true" ]; then
            echo "::notice::review skipped: $(echo "$VERDICT" | jq -r '.skip_reason // "no reason given"')"
            exit 0
          fi

          echo "$VERDICT" | jq -r '
            .findings[]
            | "\(if .blocking then "BLOCKING" else .severity end)  \(.file):\(.line // 0)  \(.summary)"
          '

          if [ "$(echo "$VERDICT" | jq -r '.blocking')" = "true" ]; then
            echo "::error::blocking finding — see the review comments on this PR"
            exit 1
          fi
          echo "no blocking findings"
