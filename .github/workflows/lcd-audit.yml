# LCD cross-path audit gate — generated by /lcd:onboard (CI option).
#
# Enforces the Deep-lane audit on PRs for EVERY contributor and agent, not just
# well-behaved Claude sessions: any PR touching a work-item with a spec + plan must
# have every (AC × surface) pair backed by an existing handler and a test carrying
# the literal `AC-N (SURFACE)`.
#
# The scripts are VENDORED at docs/lcd/ci/ (CI can't assume the plugin is
# installed). Re-run /lcd:onboard to refresh them after a plugin update.
#
# D-013 deleted an earlier copy of this workflow because it had become a no-op with
# no acceptance criteria left to check; D-014 reinstates it with the pipeline. The
# `paths:` filter is what keeps D-009's warning satisfied — a PR that touches no
# work-item never runs this job, so it cannot become a check that blocks silently.

name: LCD audit gate

on:
  pull_request:
    paths:
      - "docs/lcd/work/**"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # BASE_REF goes through env rather than being interpolated into the script body.
      # A git ref may legally contain `$`, backticks and `;` (check-ref-format only bars
      # space, ~, ^, :, ?, *, [ and \), so a `${{ }}` expansion inside `run:` is a shell
      # injection site. It is not reachable here — for `pull_request`, base_ref names a
      # branch of THIS repo, which a fork contributor cannot create — but the two-line
      # form costs nothing and does not depend on that argument staying true. This is a
      # deliberate deviation from the plugin's template; keep it across refreshes.
      - name: Audit changed work-items
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch -q origin "$BASE_REF"
          slugs="$(git diff --name-only "origin/$BASE_REF"...HEAD \
            | sed -n 's|^docs/lcd/work/\([^/]*\)/.*|\1|p' | sort -u)"
          [ -n "$slugs" ] || { echo "no work-items touched"; exit 0; }
          rc=0
          # Newline-safe: an unquoted `for` would word-split a slug containing a
          # space into fragments that all skip as "not Deep-lane" — silent bypass.
          while IFS= read -r slug; do
            [ -n "$slug" ] || continue
            dir="docs/lcd/work/$slug"
            # Only Deep-lane items (spec + plan) carry the cross-path contract.
            if [ ! -f "$dir/spec.md" ] || [ ! -f "$dir/plan.md" ]; then
              echo "::notice::$slug: no spec.md + plan.md — not a Deep-lane item, skipping"
              continue
            fi
            echo "## auditing $slug"
            if ! LCD_SPECS_DIR="docs/lcd/work" bash "docs/lcd/ci/audit-crosspath.sh" "$slug"; then
              echo "::error::LCD audit BLOCKED for work-item '$slug' — see table above"
              rc=1
            fi
          done <<< "$slugs"
          exit $rc
